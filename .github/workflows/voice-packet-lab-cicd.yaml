name: voice-packet-lab-cicd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-packet-lab-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_NAME: voice-packet-lab
  HOST_PORT: "8089"
  CONTAINER_PORT: "3000"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따른다
      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위/통합 테스트
        run: pnpm test

  build:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # .env(VITE_PRESENTER_PASSWORD)는 빌드 단계에서 클라이언트 번들에만 들어간다.
      # env: 로 먼저 받아 쉘 변수로 전달해야 값 안의 특수문자가 쉘 쿼팅을 깨지 않는다.
      - name: Create .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE 시크릿이 비어 있습니다."
            exit 1
          fi
          printf '%s' "$ENV_FILE" > .env
          if ! grep -Eq '^VITE_PRESENTER_PASSWORD=.+' .env; then
            echo "ENV_FILE 에 VITE_PRESENTER_PASSWORD 값이 없습니다."
            exit 1
          fi

      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:main
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:main
          cache-to: type=inline

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PW: ${{ secrets.SERVER_PASSWORD }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:main
          CONTAINER_NAME: ${{ env.PROJECT_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: PW,IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin

            sudo_run() {
              printf '%s\n' "$PW" | sudo -S -p '' "$@"
            }

            echo "이미지=${IMAGE}"
            echo "컨테이너 이름=${CONTAINER_NAME} | 포트=${HOST_PORT}:${CONTAINER_PORT}"

            echo "도커 이미지 풀 : ${IMAGE}"
            sudo_run docker pull "${IMAGE}"

            echo "컨테이너 ${CONTAINER_NAME} 존재 여부 확인 중..."
            if sudo_run docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "컨테이너 ${CONTAINER_NAME} 이(가) 존재합니다. 중지 및 삭제 중..."
              sudo_run docker rm -f "${CONTAINER_NAME}"
              echo "컨테이너 ${CONTAINER_NAME} 이(가) 삭제되었습니다."
            else
              echo "존재하는 컨테이너 ${CONTAINER_NAME} 이(가) 없습니다."
            fi

            echo "새로운 컨테이너 ${CONTAINER_NAME} 실행 중..."
            sudo_run docker run -d -p "${HOST_PORT}":"${CONTAINER_PORT}" --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -e TZ=Asia/Seoul \
              -v /etc/localtime:/etc/localtime:ro \
              "${IMAGE}"

            echo "헬스체크 (최대 60회, 1초 간격)"
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${HOST_PORT}/healthz" >/dev/null 2>&1; then
                echo "헬스체크 성공 (시도 ${i})"
                HEALTH_OK=1
                break
              fi
              echo "헬스체크 진행중... (시도 ${i}/60)"
              sleep 1
            done

            if [ "${HEALTH_OK:-0}" != "1" ]; then
              echo "[오류] 헬스체크 실패 -> 배포 중단, 로그 출력"
              sudo_run docker logs --tail=200 "${CONTAINER_NAME}"
              exit 1
            fi

            # <none> 태그로 남은 이미지만 정리한다
            echo "불필요한 dangling(<none>) 이미지 정리..."
            sudo_run docker image prune -f

            echo "배포가 성공적으로 완료되었습니다."
